[package]
name = "wallet-signer"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "wallet-tools-signer"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
airgap-core = { workspace = true }

# Cardano crypto: Ed25519 + Ed25519-BIP32 (SecretKeyExtended) for signing
# with extended keys converted from mnemonic wallets.
pallas-crypto.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true

tower-http = { version = "0.6", features = ["set-header"] }

# Frontend assets are embedded into the binary at compile time so the
# signer is a single executable that can be copied onto the air-gapped VM.
# The embedded files carry fixed timestamps, so rebuilding the frontend
# does not change the binary: a release can be reproduced from the source.
rust-embed = { version = "8", features = ["deterministic-timestamps"] }
mime_guess = "2"

# Ed25519 signing for the payment witnesses.
ed25519-dalek = "2"

hex = "0.4"
sha2 = "0.10"

# OS CSPRNG for air-gapped key generation.
getrandom = "0.2"

zeroize = { workspace = true }

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "process", "io-util"] }
# Inline body construction for the end-to-end sign-core test.
pallas-primitives.workspace = true
pallas-codec.workspace = true
pallas-addresses.workspace = true
bech32 = "0.11"
