name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        # rustup ships on the runner image; installing through it avoids a
        # mutable third-party action ref for the toolchain.
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          rustup default 1.85.0

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Frontend type-binding drift
        # Regenerate the canonical core-wire.ts single-threaded (parallel
        # ts_rs export tests race on the shared file) and fail if it differs
        # from the committed bindings.
        run: |
          cargo test --quiet export_bindings -- --test-threads=1
          git diff --exit-code frontend/src/types/core-wire.ts

      - name: Test
        run: cargo test --verbose

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo-audit
        # The ignore list in .cargo/audit.toml is empty on purpose:
        # airgap-core links none of the vendored-Amaru crates the tools
        # accept advisories for, so anything that surfaces here must be
        # triaged, not silenced.
        run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Run cargo-deny
        run: cargo deny check
