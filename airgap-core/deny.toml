# cargo-deny configuration for airgap-core.
# See https://embarkstudios.github.io/cargo-deny/ for the schema.
#
# airgap-core is published and consumed independently of SPO Tools and
# DREP Tools, so it carries its own supply-chain policy rather than
# inheriting either tool's. Its dependency tree is a pure crates.io tree:
# unlike the tools, it does NOT link the vendored Amaru VRF/KES crates, so
# none of those crates' advisories apply here, and its X25519 channel
# stack rides on curve25519-dalek 4.x (constant-time), not the 3.2.0 fork.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# No advisories ignored. airgap-core's tree carries none of the Amaru
# vendored-crate advisories the tools accept; if a real advisory surfaces
# here it must be triaged, not pre-silenced. Enforced by the `cargo deny
# check` CI job (.github/workflows/ci.yml) on every push and pull request.
ignore = []

[bans]
# One version per crate is the goal; a NEW unexpected duplicate from a
# dependency bump (e.g. a second curve25519-dalek or zeroize line) fails
# the check and gets reviewed. The known transitive duplicates come in
# through pallas-* and ecosystem major-version churn (thiserror 1 -> 2,
# syn 1 -> 2, ...) and are enumerated in skip, matching the product repos.
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
skip = [
  { crate = "bech32" },
  { crate = "getrandom" },
  { crate = "hashbrown" },
  { crate = "indexmap" },
  { crate = "minicbor" },
  { crate = "minicbor-derive" },
  { crate = "schemars" },
  { crate = "syn" },
  { crate = "thiserror" },
  { crate = "thiserror-impl" },
]

[licenses]
# airgap-core is itself MIT OR Apache-2.0; allow that plus the BSD/MIT
# family that surfaces from the rust-crypto, pallas, and serde crates.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "BlueOak-1.0.0",
]
confidence-threshold = 0.8

[sources]
# airgap-core has no git or vendored path dependencies — every crate comes
# from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
