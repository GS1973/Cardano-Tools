[package]
name = "airgap-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Smit Blockchain Operations (Pool BKIND) <developmentbkind@gmail.com>"]
description = "Role-neutral air-gapped transport + Cardano primitives shared by SPO Tools, DREP Tools, and Wallet Tools."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
thiserror = "1"
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }
ur = "0.4"
hex = "0.4"
bech32 = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
getrandom = "0.2"
http = "1"
axum = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Cardano building blocks for the role-neutral transaction + validation
# primitives (tx assembly, body decode, forbidden-field guard). Both tools
# build on the same bytes, so they live here rather than being copied.
pallas-primitives = "0.35"
pallas-codec      = "0.35"
pallas-crypto     = "0.35"
pallas-addresses  = "0.35"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
