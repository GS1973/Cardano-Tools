[package]
name = "drep-online"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "drep-tools-online"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
airgap-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
bech32 = "0.11"
pallas-primitives.workspace = true
pallas-codec.workspace = true
pallas-crypto.workspace = true
pallas-addresses.workspace = true
hex = "0.4"
zeroize = { workspace = true }

# Frontend assets are embedded into the binary at compile time so
# deployment is a single executable.
rust-embed = "8"
mime_guess = "2"

ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }

[dev-dependencies]
tempfile = "3"
