name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# NOTE: this workspace depends on the sibling `airgap-core` via a path
# dependency (../airgap-core). Jobs that resolve the workspace graph
# (build-test, deny) are guarded by the AIRGAP_CORE_WIRED repository
# variable and stay skipped until airgap-core is published and its sibling
# checkout is wired here. The deny job carries a commented
# actions/checkout template for that sibling checkout: fill in the
# airgap-core repository slug and uncomment it (and the layout tweaks it
# describes) before setting AIRGAP_CORE_WIRED, otherwise the gated jobs
# fail at workspace resolution. The audit job reads only Cargo.lock, so
# it gates every push/PR today.
jobs:
  build-test:
    name: build + test
    if: ${{ vars.AIRGAP_CORE_WIRED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        # rustup ships on the runner image; installing through it avoids a
        # mutable third-party action ref for the toolchain.
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          rustup default 1.85.0

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Build frontends
        run: |
          npm install
          npm --prefix drep-online/frontend run build
          npm --prefix drep-signer/frontend run build

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Clippy (own crates)
        # --no-deps lints only our crates, not path/vendored dependencies.
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Frontend type-binding drift
        # Regenerate the ts_rs bindings and fail if they differ from the committed files.
        run: bash tools/gen-frontend-types.sh --check

      - name: Test workspace
        run: cargo test --workspace --verbose

      - name: Frontend tests
        run: |
          npm --prefix drep-online/frontend test
          npm --prefix drep-signer/frontend test

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo-audit
        # No ignore list here (and deny.toml's advisory ignore list is
        # empty): anything that surfaces must be triaged, not silenced.
        run: cargo audit --deny warnings

  deny:
    name: cargo deny
    # cargo-deny resolves the full workspace graph, which needs the sibling
    # airgap-core checkout — same guard as build-test. The commented step
    # below is the checkout to wire before setting AIRGAP_CORE_WIRED.
    if: ${{ vars.AIRGAP_CORE_WIRED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Sibling-checkout template — required before AIRGAP_CORE_WIRED is
      # set. Cargo.toml points at ../airgap-core, but actions/checkout
      # cannot write outside $GITHUB_WORKSPACE, so both checkouts need a
      # path inside it: add `path: drep-tools` to the checkout step above,
      # uncomment the step below, and add `working-directory: drep-tools`
      # to the remaining steps of this job. Replace <ORG> with the GitHub
      # org/user airgap-core is published under (none is configured yet —
      # do NOT set AIRGAP_CORE_WIRED until it exists).
      # - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      #   with:
      #     repository: <ORG>/airgap-core
      #     path: airgap-core
      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Run cargo-deny
        run: cargo deny check
