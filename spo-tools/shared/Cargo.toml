[package]
name = "shared"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Role-neutral primitives (QR/UR transport, channel crypto, PIN proof,
# key loading, chain context) live in airgap-core and are re-exported
# from lib.rs; this crate carries only the SPO-specific wire types and
# validators on top.
airgap-core = { path = "../../airgap-core" }
serde.workspace = true
serde_json.workspace = true
serde_with = "3"
thiserror.workspace = true
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }

# Cardano building blocks
pallas-primitives.workspace = true
pallas-codec.workspace = true
pallas-addresses.workspace = true
pallas-math.workspace = true

# Hex / bech32 codecs for the hash and address fields on the wire types.
hex = "0.4"
bech32 = "0.11"

# Blake2b-256 for the Praos VRF input and slot-leader test (praos.rs).
blake2 = "0.10"
