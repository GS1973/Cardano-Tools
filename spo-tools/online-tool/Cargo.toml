[package]
name = "online-tool"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "spo-tools-online"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
# The guarded document fetch: online tool only, never the signer.
airgap-fetch-guard = { path = "../../airgap-core/fetch-guard" }
bech32 = "0.11"
zeroize = { workspace = true }
pallas-primitives.workspace = true
pallas-codec.workspace = true
pallas-crypto.workspace = true
pallas-addresses.workspace = true
hex = "0.4"

# Frontend assets are embedded into the binary at compile time so
# deployment is a single executable.
# The embedded files carry fixed timestamps, so rebuilding the frontend
# does not change the binary: a release can be reproduced from the source.
rust-embed = { version = "8", features = ["deterministic-timestamps"] }
mime_guess = "2"

# tower-http kept for the trace layer (request logging) and a fixed set of
# security response headers (CSP, X-Frame-Options, X-Content-Type-Options).
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
