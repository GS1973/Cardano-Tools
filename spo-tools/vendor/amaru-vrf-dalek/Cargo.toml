[package]
name = "amaru-vrf-dalek"
version = "0.1.0"
authors = ["iquerejeta <querejeta.azurmendi@iohk.io>"]
edition = "2018"
license = "Apache-2.0"
repository = "https://github.com/pragma-org/amaru"

[lib]
name = "vrf_dalek"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The implementation of version 3 of the VRF function (the one used in Cardano previous to Babbage) always unsets
# the sign bit in the elligator function. However, the exposure that curve25519-dalek offers, does not allow us to
# modify the elligator function. Therefore we rely on a fork that simply sets the bit. The fork deviates from
# the upstream 3.2.0 tag in two ways: the elligator sign flip above, plus the `black_box` optimization barrier
# backported from curve25519-dalek 4.1.3 into `Scalar29::sub`/`Scalar52::sub` (the RUSTSEC-2024-0344 timing
# fix). See ../PROVENANCE.md for the audited lineage of both deviations.
curve25519-dalek-fork = { package = "amaru-curve25519-dalek", path = "../amaru-curve25519-dalek", version = "3.2.0" }
# Only the draft-10 (`vrf10`) modules use the unforked, published
# curve25519-dalek. It is optional and pulled in solely by the `vrf10`
# feature so the default build (draft-03 only) never links the 3.2.0
# release that carries RUSTSEC-2024-0344.
curve25519-dalek = { version = "3", optional = true }
rand_core = "0.5"
sha2 = "0.9"
blake3 = { version = "1.2.0", optional = true }
thiserror = "1"

[dev-dependencies]
rand_chacha = "0.2"
hex = "0.4.2"
criterion = "0.3.5"

[features]
# Off by default: `vrf03` (the only flavour SPO Tools signs) needs only the
# vendored fork. `vrf10` enables the published draft-10 modules and their
# crates.io `curve25519-dalek` dependency (RUSTSEC-2024-0344).
default = []
vrf10 = ["dep:curve25519-dalek"]
batch_deterministic = ["blake3", "vrf10"]

[[bench]]
name = "vrf10"
harness = false
required-features = ["vrf10"]
